[workspace]
resolver = "2"
members = [
    "crates/models",
    "crates/oscc-core",
    "crates/hosxp-connector",
    "server",
    "src-tauri",
]
# The GUI shell is excluded from default commands so `cargo test` at the root
# stays fast and headless. Check it explicitly with `-p oscc-tauri` or
# `--workspace`.
default-members = [
    "crates/models",
    "crates/oscc-core",
    "crates/hosxp-connector",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"               # rich context propagation in binary crates
axum = "0.8"                 # HTTP API for the central server
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }  # timestamps for cases and deadlines
hex = "0.4"                  # hex encoding for audit hashes and tokens
secrecy = { version = "0.10", features = ["serde"] }  # secrets: zeroized on drop, Debug-redacted
serde = { version = "1.0", features = ["derive"] }  # IPC and API payloads
serde_json = "1.0"           # structured API payloads
sha2 = "0.10"                # SHA-256 for audit chain and token storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "chrono", "tls-rustls-ring-native-roots", "migrate", "macros"] }  # HOSxP reads (MySQL) and OSCC storage (PostgreSQL)
thiserror = "2"              # structured errors in library crates
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }  # async runtime
tracing = "0.1"              # PII-free structured logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }  # log wiring
