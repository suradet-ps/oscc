[workspace]
resolver = "2"
members = [
    "crates/models",
    "crates/oscc-core",
    "crates/hosxp-connector",
    "server",
    "src-tauri",
]
# The GUI shell is excluded from default commands so `cargo test` at the root
# stays fast and headless. Check it explicitly with `-p oscc-tauri` or
# `--workspace`.
default-members = [
    "crates/models",
    "crates/oscc-core",
    "crates/hosxp-connector",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"               # rich context propagation in binary crates
argon2 = "0.5"               # Argon2id password hashing for local accounts
async-trait = "0.1"          # dyn-compatible async patient-source trait
axum = "0.8"                 # HTTP API for the central server
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }  # timestamps for cases and deadlines
encryptman = "0.5.0"         # AES-256-GCM encrypted HOSxP credentials at rest
encryptman-keyring = "0.1.3"  # OS-keychain storage of the encryptman master key
hex = "0.4"                  # hex encoding for audit hashes and tokens
rand = "0.8"                 # session token material
secrecy = { version = "0.10", features = ["serde"] }  # secrets: zeroized on drop, Debug-redacted
serde = { version = "1.0", features = ["derive"] }  # IPC and API payloads
serde_json = "1.0"           # structured API payloads
sha2 = "0.11"                # SHA-256 for audit chain and token storage
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "chrono", "tls-rustls-ring-native-roots", "migrate", "macros"] }  # HOSxP reads (MySQL) and OSCC storage (PostgreSQL)
tempfile = "3"               # disposable directories in tests
thiserror = "2"              # structured errors in library crates
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "fs"] }  # async runtime
tower-http = { version = "0.6", features = ["cors"] }  # LAN CORS for the desktop webview
tracing = "0.1"              # PII-free structured logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }  # log wiring
